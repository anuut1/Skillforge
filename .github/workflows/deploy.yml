name: SkillForge CI/CD Pipeline

on:
  push:
    branches: [ main, master, aws-migration ]
  pull_request:
    branches: [ main, master, aws-migration ]

jobs:
  test_and_build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: |
          server/package-lock.json
          client/package-lock.json

    # Server Test & Build
    - name: Install Server Dependencies
      working-directory: ./server
      run: npm ci

    - name: Validate Server TypeScript
      working-directory: ./server
      run: npm run build

    # Client Test & Build
    - name: Install Client Dependencies
      working-directory: ./client
      run: npm ci

    - name: Build Frontend SPA
      working-directory: ./client
      run: npm run build

  deploy_aws:
    needs: test_and_build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Configure AWS Credentials via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: ap-south-1
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        role-session-name: GitHubActions-SkillForgeDeploy

    - name: Deploy Frontend to S3
      working-directory: ./client
      run: |
        npm ci
        npm run build
        aws s3 sync dist/ s3://${{ secrets.S3_FRONTEND_BUCKET }} --delete

    - name: Invalidate CloudFront Cache
      run: |
        aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"
